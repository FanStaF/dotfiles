# Docker Compose for PHP/Laravel Development
# Usage: docker compose up -d

version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: dev-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: development
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - dev-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache/Queue
  redis:
    image: redis:7-alpine
    container_name: dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MailHog (Email testing)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: dev-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - dev-network

  # phpMyAdmin (Optional - uncomment to use)
  # phpmyadmin:
  #   image: phpmyadmin:latest
  #   container_name: dev-phpmyadmin
  #   restart: unless-stopped
  #   ports:
  #     - "8080:80"
  #   environment:
  #     PMA_HOST: mysql
  #     PMA_USER: root
  #     PMA_PASSWORD: password
  #   depends_on:
  #     - mysql
  #   networks:
  #     - dev-network

  # Meilisearch (Optional - for Laravel Scout)
  # meilisearch:
  #   image: getmeili/meilisearch:latest
  #   container_name: dev-meilisearch
  #   restart: unless-stopped
  #   ports:
  #     - "7700:7700"
  #   environment:
  #     MEILI_ENV: development
  #     MEILI_NO_ANALYTICS: true
  #   volumes:
  #     - meilisearch_data:/meili_data
  #   networks:
  #     - dev-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  # meilisearch_data:
  #   driver: local

networks:
  dev-network:
    driver: bridge
